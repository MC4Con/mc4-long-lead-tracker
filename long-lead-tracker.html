function close_all_except_import() {
  ['add-form','detail-panel'].forEach(id => {
    const el = document.getElementById(id); if (el) el.style.display = 'none';
  });
}

function panel_close() {
  document.getElementById('import-panel').style.display = 'none';
}

function filterBulkLinkList(query) {
  const q = query.toLowerCase();
  const list = document.getElementById('bulk-link-list');
  if (!list) return;

  const matches = (window._bulkLinkItems || []).filter(i => {
    if (!q) return true;
    return (i.submittalNum||'').toLowerCase().includes(q) ||
           (i.item||'').toLowerCase().includes(q) ||
           (i.project||'').toLowerCase().includes(q);
  });

  if (!matches.length) {
    list.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--text2);font-size:12px">No submittals found. Try importing your Autodesk XLSX first.</div>';
    return;
  }

  list.innerHTML = matches.map(i => `
    <div onclick="confirmBulkLink(${i.id})"
      style="padding:10px 12px;border-bottom:0.5px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:10px"
      onmouseover="this.style.background='var(--bg2)'" onmouseout="this.style.background=''">
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:500;color:var(--text)">${esc(i.submittalNum||'No #')} — ${esc(i.item)}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">
          ${i.project?esc(i.project)+' · ':''}Stage ${i.stage+1}: ${STAGES[Number(i.stage)]}
          ${i.submittalStatus?' · '+esc(i.submittalStatus):''}
        </div>
      </div>
      <button class="btn primary" style="height:26px;font-size:11px;flex-shrink:0">Link all</button>
    </div>`).join('');
}

function confirmBulkLink(sourceId) {
  const ids = window._bulkTargetIds || [];
  const source = items.find(x => x.id === sourceId);
  if (!source) return;

  const count = ids.length;
  if (!confirm('Link ' + count + ' item' + (count!==1?'s':'') + ' to submittal "' + (source.submittalNum||source.item) + '"?')) return;

  ids.forEach(id => {
    const target = items.find(x => x.id === id);
    if (!target) return;
    target.submittalNum = source.submittalNum || target.submittalNum;
    target.submittalTitle = source.item;
    target.submittalStatus = source.submittalStatus || '';
    target.finalResponse = source.finalResponse || '';
    if (Number(source.stage) > Number(target.stage)) {
      target.stage = Number(source.stage);
    }
  });

  // Offer to remove the Autodesk-only source row
  if (source.source === 'autodesk' && !source.po) {
    if (confirm('Remove the Autodesk-only "' + source.item + '" row since it is now linked to your KOJO items?')) {
      items = items.filter(x => x.id !== sourceId);
    }
  }

  panel_close();
  clearSelection();
  buildProjFilter(); buildPills(); render(); saveToSheet();
  alert('✓ ' + count + ' item' + (count!==1?'s':'') + ' linked to submittal ' + (source.submittalNum||source.item));
}

// ── LINK SUBMITTAL ────────────────────────────────────────────
function showLinkSubmittal(id) {
  const item = items.find(x => x.id === id);
  if (!item) return;

  // Find all items that came from Autodesk (have a submittalNum)
  // and items that are unlinked (source=autodesk, no PO)
  const autodeskItems = items.filter(i => i.submittalNum && i.id !== id);

  // Build a searchable picker panel
  const panel = document.getElementById('detail-panel');
  const currentLink = item.submittalNum ? 
    `<div style="font-size:12px;color:var(--text2);margin-bottom:12px;padding:8px 10px;background:var(--bg2);border-radius:var(--radius)">
      Currently linked: <strong style="color:var(--text)">${esc(item.submittalNum)} — ${esc(item.submittalTitle||item.item)}</strong>
      <button class="btn danger" style="margin-left:8px;height:24px;font-size:11px" onclick="unlinkSubmittal(${id})">Remove link</button>
    </div>` : '';

  panel.innerHTML = `<div class="card">
    <button class="close-x" onclick="showDetail(${id})">×</button>
    <h3><i class="ti ti-link"></i> Link submittal to: ${esc(item.item)}</h3>
    ${currentLink}
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px">Search your Autodesk submittals and click one to link it to this item.</div>
    <input type="text" id="link-search" placeholder="Search by submittal number or title…" 
      style="width:100%;font-size:12px;padding:7px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);margin-bottom:10px"
      oninput="filterLinkList(${id}, this.value)">
    <div id="link-list" style="border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;max-height:320px;overflow-y:auto"></div>
    <div style="font-size:11px;color:var(--text2);margin-top:8px">
      Can't find it? The submittal may not have been imported yet — import your Autodesk XLSX first, then come back to link.
    </div>
  </div>`;

  // Store the full list for filtering
  window._linkItems = autodeskItems;
  window._linkTargetId = id;
  filterLinkList(id, '');
  document.getElementById('link-search').focus();
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function filterLinkList(targetId, query) {
  const q = query.toLowerCase();
  const list = document.getElementById('link-list');
  if (!list) return;

  const matches = (window._linkItems || []).filter(i => {
    if (!q) return true;
    return (i.submittalNum||'').toLowerCase().includes(q) ||
           (i.item||'').toLowerCase().includes(q) ||
           (i.submittalTitle||'').toLowerCase().includes(q) ||
           (i.project||'').toLowerCase().includes(q);
  });

  if (!matches.length) {
    list.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--text2);font-size:12px">No submittals found matching your search.</div>';
    return;
  }

  list.innerHTML = matches.map(i => {
    const stageLabel = STAGES[Number(i.stage)] || '';
    const isLinked = items.some(x => x.id !== targetId && x.submittalNum === i.submittalNum && x.submittalNum);
    return `<div onclick="confirmLink(${targetId}, ${i.id})" style="padding:10px 12px;border-bottom:0.5px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background 0.1s"
      onmouseover="this.style.background='var(--bg2)'" onmouseout="this.style.background=''">
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:500;color:var(--text)">${esc(i.submittalNum||'No number')} — ${esc(i.item)}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">
          ${i.project?'<span>'+esc(i.project)+'</span> · ':''}
          <span style="color:var(--info)">${stageLabel}</span>
          ${i.submittalStatus?' · '+esc(i.submittalStatus):''}
          ${isLinked?'<span style="color:var(--warn);margin-left:4px">(already linked to another item)</span>':''}
        </div>
      </div>
      <button class="btn primary" style="height:26px;font-size:11px;flex-shrink:0">Link</button>
    </div>`;
  }).join('');
}

function confirmLink(targetId, sourceId) {
  const target = items.find(x => x.id === targetId);
  const source = items.find(x => x.id === sourceId);
  if (!target || !source) return;

  // Copy submittal info from source to target
  target.submittalNum = source.submittalNum || target.submittalNum;
  target.submittalTitle = source.item;
  target.submittalStatus = source.submittalStatus || '';
  target.finalResponse = source.finalResponse || '';

  // Advance stage if source is further along
  if (Number(source.stage) > Number(target.stage)) {
    target.stage = Number(source.stage);
  }

  // Ask if they want to remove the now-duplicate Autodesk-only item
  const removeSource = source.source === 'autodesk' && !source.po;
  if (removeSource) {
    if (confirm(`Link successful! The Autodesk submittal "${source.item}" was imported as a separate row. Remove that duplicate row now?`)) {
      items = items.filter(x => x.id !== sourceId);
    }
  }

  buildProjFilter(); buildPills(); render(); saveToSheet();
  showDetail(targetId);
}

function unlinkSubmittal(id) {
  const item = items.find(x => x.id === id);
  if (!item) return;
  if (!confirm('Remove the submittal link from this item?')) return;
  item.submittalNum = '';
  item.submittalTitle = '';
  item.submittalStatus = '';
  item.finalResponse = '';
  saveToSheet();
  showDetail(id);
}

// ── COLUMN RESIZER ────────────────────────────────────────────
function initResizers() {
  const table = document.querySelector('table');
  if (!table) return;
  const cols = table.querySelectorAll('thead th');
  cols.forEach(th => {
    const resizer = th.querySelector('.resizer');
    if (!resizer) return;
    let startX, startW;
    resizer.addEventListener('mousedown', e => {
      startX = e.pageX;
      startW = th.offsetWidth;
      resizer.classList.add('dragging');
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
      e.preventDefault();
    });
    function onMouseMove(e) {
      const newW = Math.max(60, startW + (e.pageX - startX));
      th.style.width = newW + 'px';
      th.style.minWidth = newW + 'px';
    }
    function onMouseUp() {
      resizer.classList.remove('dragging');
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }
  });
}

// Re-init resizers after every render since thead is static
const _origRender = render;
// Patch: call initResizers once after first load
document.addEventListener('DOMContentLoaded', () => setTimeout(initResizers, 1000));

['proj-f','risk-f'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{buildPills();render();}));
document.getElementById('srch').addEventListener('input',render);

// Populate the bulk "move to stage" dropdown from the STAGES list
(function populateBulkStageDropdown() {
  const sel = document.getElementById('bulk-stage-select');
  if (sel) {
    sel.innerHTML = '<option value="">Move to stage…</option>' +
      STAGES.map((s, i) => `<option value="${i}">${i+1}. ${s}</option>`).join('');
  }
})();

loadFromSheet();
</script>
